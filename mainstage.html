<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Name Wheel</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/meetjs/addons/1.1.0/meet.addons.js"></script>
</head>
<body data-surface="mainstage">
  <main class="app mainstage">
    <section class="controls">
      <header>
        <h1>Name Wheel</h1>
      </header>
      <div id="sound-hint" class="sound-hint" hidden>Click anywhere for sound</div>
      <div id="people" class="people" role="group" aria-label="People on the wheel"></div>
      <div id="status" class="status"></div>
    </section>
    <section class="stage-area">
      <div id="spin" class="wheel-wrap" role="button" tabindex="0" aria-label="Spin the wheel">
        <canvas id="wheel"></canvas>
        <div id="celebration" class="celebration" hidden>
          <img alt="">
          <div class="name"></div>
          <div class="tag">Today's HUDLmaster</div>
        </div>
      </div>
      <div id="winner" class="winner"></div>
    </section>
  </main>
  <canvas id="confetti" class="confetti"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
